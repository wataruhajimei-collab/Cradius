<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>クラディウス</title>
    <!-- ホーム画面追加用アイコン・Webアプリ設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="クラディウス">
    <meta name="application-name" content="クラディウス">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3.0">
</head>
<body>
    <div id="game-wrapper">
        <!-- ゲーム画面（画面目一杯に拡大） -->
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
        <!-- アーケード・グラディウス忠実再現タイトル画面オーバーレイ -->
        <div id="start-screen" class="arcade-start-screen">
            <div class="arcade-cabinet-frame">
                <!-- メインウイングエンブレムロゴ -->
                <div class="arcade-title-block">
                    <img src="assets/title_logo.svg" alt="CRADIUS" class="arcade-title-logo">
                </div>

                <!-- 中央テキスト: コイン投入／スタート & ボーナススコア告知 -->
                <div class="arcade-center-block">
                    <div id="btn-start" class="arcade-coin-prompt" role="button" tabindex="0">PLEASE DEPOSIT COIN</div>
                    
                    <div class="arcade-bonus-info">
                        <div class="bonus-row">
                            <span class="bonus-col-left">1ST&nbsp;&nbsp;BONUS&nbsp;&nbsp;AT</span>
                            <span class="bonus-col-right">30000PTS</span>
                        </div>
                        <div class="bonus-row">
                            <span class="bonus-col-left">AND&nbsp;&nbsp;THEN&nbsp;&nbsp;&nbsp;EVERY</span>
                            <span class="bonus-col-right">80000PTS</span>
                        </div>
                    </div>
                </div>

                <!-- 下部: コマミロゴ・著作権 & クレジット表示 -->
                <div class="arcade-footer-block">
                    <div class="konami-brand-row">
                        <span class="konami-wordmark">Komami<span class="konami-reg">&reg;</span></span>
                    </div>
                    <div class="arcade-bottom-row">
                        <div class="konami-copyright">&copy;&nbsp;KOMAMI&nbsp;&nbsp;2026</div>
                        <div class="arcade-credit-box">
                            <span class="credit-lbl">CREDIT</span>
                            <span class="credit-badge">01</span>
                        </div>
                    </div>
                </div>

                <!-- 操作ヒント -->
                <div class="arcade-tap-hint">TAP SCREEN OR PRESS [SPACE] TO START</div>
            </div>
        </div>

        <!-- 画面全体（余白を含む全域）をカバーするタッチ操作レイヤー -->
        <div id="touch-layer">
            <!-- 画面左側（余白〜画面中央）：どこでもスワイプ移動可能 -->
            <div id="touch-move-zone">
                <div id="move-hint">画面のどこでもスワイプ移動</div>
                <!-- 指の直下に現れるフローティングジョイスティック -->
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>

            <!-- 右側アクションボタン（余白または画面右端に配置） -->
            <div id="action-buttons">
                <button id="btn-powerup" class="action-btn btn-power" aria-label="パワーアップ">
                    <span class="btn-main">POWER</span>
                    <span class="btn-sub">[X]</span>
                </button>
                <button id="btn-shot" class="action-btn btn-shot" aria-label="ショット">
                    <span class="btn-main">SHOT</span>
                    <span class="btn-sub">[Z]</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/sound.js?v=3.0"></script>
    <script src="js/input.js?v=3.0"></script>
    <script src="js/collision.js?v=3.0"></script>
    <script src="js/particle.js?v=3.0"></script>
    <script src="js/bullet.js?v=3.0"></script>
    <script src="js/enemy.js?v=3.0"></script>
    <script src="js/powerup.js?v=3.0"></script>
    <script src="js/ui.js?v=3.0"></script>
    <script src="js/option.js?v=3.0"></script>
    <script src="js/boss.js?v=3.0"></script>
    <script src="js/level.js?v=3.0"></script>
    <script src="js/stonehenge.js?v=3.0"></script>
    <script src="js/stage3.js?v=3.0"></script>
    <script src="js/player.js?v=3.0"></script>
    <script src="js/main.js?v=3.0"></script>
</body>
</html>
