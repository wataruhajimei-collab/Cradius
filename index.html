<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>クラディウス</title>
    <!-- ホーム画面追加用アイコン・Webアプリ設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="クラディウス">
    <meta name="application-name" content="クラディウス">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=5.3">
</head>
<body>
    <div id="game-wrapper">
        <!-- ゲーム画面（画面目一杯に拡大） -->
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
        <!-- アーケード・グラディウス忠実再現タイトル画面オーバーレイ -->
        <div id="start-screen" class="arcade-start-screen">
            <div class="arcade-cabinet-frame">
                <!-- 上部スコア表示行 (1P / HI / 2P) -->
                <div class="arcade-top-score-row">
                    <div class="arcade-score-item">
                        <span class="arcade-score-label">1P</span>
                        <span id="title-1p-score" class="arcade-score-value">0000000</span>
                    </div>
                    <div class="arcade-score-item">
                        <span class="arcade-score-label">HI</span>
                        <span id="title-hi-score" class="arcade-score-value">0057300</span>
                    </div>
                    <div class="arcade-score-item">
                        <span class="arcade-score-label">2P</span>
                        <span class="arcade-score-value">0000000</span>
                    </div>
                </div>

                <!-- メインウイングエンブレムロゴ -->
                <div class="arcade-title-block">
                    <img src="assets/title_logo.svg" alt="CRADIUS" class="arcade-title-logo">
                </div>

                <!-- 中央テキスト: コイン投入／スタート & ボーナススコア告知 -->
                <div class="arcade-center-block">
                    <div id="btn-start" class="arcade-coin-prompt" role="button" tabindex="0">PLEASE DEPOSIT COIN</div>
                    
                    <div class="arcade-bonus-info">
                        <div class="bonus-row">
                            <span class="bonus-col-left">1ST&nbsp;&nbsp;BONUS&nbsp;&nbsp;AT</span>
                            <span class="bonus-col-right">30000PTS</span>
                        </div>
                        <div class="bonus-row">
                            <span class="bonus-col-left">AND&nbsp;&nbsp;THEN&nbsp;&nbsp;&nbsp;EVERY</span>
                            <span class="bonus-col-right">80000PTS</span>
                        </div>
                    </div>

                    <!-- BGM集（サウンドテスト）を開くボタン -->
                    <button id="btn-bgm-collection" type="button" class="arcade-bgm-collection-btn">
                        🎵 BGM集を開く (SOUND TEST)
                    </button>

                    <!-- 開発者専用隠しステージセレクト（初期状態は非表示：Komamiロゴ3回タップでのみ出現） -->
                    <div id="title-stage-select" class="arcade-stage-select-row dev-secret-hidden" style="display: none;" aria-hidden="true">
                        <button type="button" class="arcade-stage4-direct-btn btn-st1" data-stage="1" data-mode="STAGE">
                            🌋 1面 (火山)
                        </button>
                        <button type="button" class="arcade-stage4-direct-btn btn-st2" data-stage="2" data-mode="STAGE">
                            🗿 2面 (ストーンヘンジ)
                        </button>
                        <button type="button" class="arcade-stage4-direct-btn btn-st3" data-stage="3" data-mode="STAGE">
                            🗿 3面 (モアイ遺跡)
                        </button>
                        <button type="button" class="arcade-stage4-direct-btn" data-stage="4" data-mode="STAGE">
                            🔥 4面 (逆火山)
                        </button>
                        <button type="button" class="arcade-stage4-direct-btn btn-jellyfish" data-stage="4" data-mode="JELLYFISH">
                            🤖 4面・大型メカ巡回
                        </button>
                        <button type="button" class="arcade-stage4-direct-btn" data-stage="4" data-mode="BOSS">
                            👑 4面・ボス
                        </button>
                    </div>
                </div>

                <!-- 下部: コマミロゴ・著作権 & クレジット表示（Komamiロゴタップで開発者用メニュー表示） -->
                <div class="arcade-footer-block">
                    <div class="konami-brand-row">
                        <span id="secret-konami-logo" class="konami-wordmark">Komami<span class="konami-reg">&reg;</span></span>
                    </div>
                    <div class="arcade-bottom-row">
                        <div class="konami-copyright">&copy;&nbsp;KOMAMI&nbsp;&nbsp;2026</div>
                        <div class="arcade-credit-box">
                            <span class="credit-lbl">CREDIT</span>
                            <span class="credit-badge">01</span>
                        </div>
                    </div>
                </div>

                <!-- 操作ヒント -->
                <div class="arcade-tap-hint">TAP SCREEN OR PRESS [SPACE] TO START</div>
            </div>
        </div>

        <!-- BGM集（サウンドテスト）モーダル -->
        <div id="bgm-modal" class="bgm-modal-overlay" aria-hidden="true">
            <div class="bgm-modal-dialog" role="dialog" aria-labelledby="bgm-modal-title">
                <div class="bgm-modal-header">
                    <h2 id="bgm-modal-title" class="bgm-modal-title">🎵 BGM COLLECTION</h2>
                    <button id="btn-bgm-close" type="button" class="bgm-modal-close-btn" aria-label="閉じる">✕ 閉じる</button>
                </div>
                <div id="bgm-now-playing" class="bgm-now-playing">曲を選択して試聴できます</div>
                <div class="bgm-track-list">
                    <button type="button" class="bgm-track-btn" data-bgm="AIR">
                        <span class="bgm-track-num">01</span>
                        <span class="bgm-track-info">
                            <span class="bgm-track-name">BEGINNING OF THE HISTORY (空中戦BGM)</span>
                            <span class="bgm-track-desc">120 BPM / 1985年AC版「Beginning of the History」実機完全採譜</span>
                        </span>
                        <span class="bgm-track-play">▶ 再生</span>
                    </button>
                    <button type="button" class="bgm-track-btn" data-bgm="STAGE1">
                        <span class="bgm-track-num">02</span>
                        <span class="bgm-track-info">
                            <span class="bgm-track-name">CHALLENGER 1985 (1面・火山)</span>
                            <span class="bgm-track-desc">134 BPM / 1985年AC版1面「Challenger 1985」実機13小節ループ完全採譜</span>
                        </span>
                        <span class="bgm-track-play">▶ 再生</span>
                    </button>
                    <button type="button" class="bgm-track-btn" data-bgm="VOLCANO">
                        <span class="bgm-track-num">03</span>
                        <span class="bgm-track-info">
                            <span class="bgm-track-name">AIRCRAFT CARRIER (1面・火山噴火)</span>
                            <span class="bgm-track-desc">134 BPM / 1985年グラディウス1面終盤・火山噴火〜ボス戦「Aircraft Carrier」実機完全採譜</span>
                        </span>
                        <span class="bgm-track-play">▶ 再生</span>
                    </button>
                    <button type="button" class="bgm-track-btn" data-bgm="STAGE2">
                        <span class="bgm-track-num">04</span>
                        <span class="bgm-track-info">
                            <span class="bgm-track-name">BEAT BACK (2面・ストーンヘンジ)</span>
                            <span class="bgm-track-desc">146 BPM / 1985年AC版2面「Beat Back」実機14小節ループ完全採譜</span>
                        </span>
                        <span class="bgm-track-play">▶ 再生</span>
                    </button>
                    <button type="button" class="bgm-track-btn" data-bgm="STAGE3">
                        <span class="bgm-track-num">05</span>
                        <span class="bgm-track-info">
                            <span class="bgm-track-name">BLANK MASK (3面・モアイ遺跡)</span>
                            <span class="bgm-track-desc">124 BPM / 1985年AC版3面「Blank Mask」実機11小節ループ完全採譜</span>
                        </span>
                        <span class="bgm-track-play">▶ 再生</span>
                    </button>
                    <button type="button" class="bgm-track-btn" data-bgm="STAGE4">
                        <span class="bgm-track-num">06</span>
                        <span class="bgm-track-info">
                            <span class="bgm-track-name">FREE FLYER (4面・逆火山)</span>
                            <span class="bgm-track-desc">134 BPM / 1985年AC版4面「Free Flyer」実機13小節ループ完全採譜</span>
                        </span>
                        <span class="bgm-track-play">▶ 再生</span>
                    </button>
                    <button type="button" class="bgm-track-btn" data-bgm="BOSS">
                        <span class="bgm-track-num">07</span>
                        <span class="bgm-track-info">
                            <span class="bgm-track-name">AIRCRAFT CARRIER (ボス戦BGM)</span>
                            <span class="bgm-track-desc">134 BPM / 1985年AC版ボス戦「Aircraft Carrier」半音階上昇イントロ＋5ch対位法完全採譜</span>
                        </span>
                        <span class="bgm-track-play">▶ 再生</span>
                    </button>
                </div>
                <div class="bgm-modal-footer">
                    <button id="btn-bgm-stop" type="button" class="bgm-stop-btn">⏹ 停止 (STOP)</button>
                    <button id="btn-bgm-close-bottom" type="button" class="bgm-return-btn">タイトル画面へ戻る</button>
                </div>
            </div>
        </div>

        <!-- 画面全体（余白を含む全域）をカバーするタッチ操作レイヤー -->
        <div id="touch-layer">
            <!-- 画面左側（余白〜画面中央）：どこでもスワイプ移動可能 -->
            <div id="touch-move-zone">
                <div id="move-hint">画面のどこでもスワイプ移動</div>
                <!-- 指の直下に現れるフローティングジョイスティック -->
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>

            <!-- 右側アクションボタン（余白または画面右端に配置） -->
            <div id="action-buttons">
                <button id="btn-powerup" class="action-btn btn-power" aria-label="パワーアップ">
                    <span class="btn-main">POWER</span>
                    <span class="btn-sub">[X]</span>
                </button>
                <button id="btn-shot" class="action-btn btn-shot" aria-label="ショット">
                    <span class="btn-main">SHOT</span>
                    <span class="btn-sub">[Z]</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/sound.js?v=5.8"></script>
    <script src="js/input.js?v=5.8"></script>
    <script src="js/collision.js?v=5.8"></script>
    <script src="js/particle.js?v=5.8"></script>
    <script src="js/bullet.js?v=5.8"></script>
    <script src="js/enemy.js?v=5.8"></script>
    <script src="js/powerup.js?v=5.8"></script>
    <script src="js/ui.js?v=5.8"></script>
    <script src="js/option.js?v=5.8"></script>
    <script src="js/boss.js?v=5.8"></script>
    <script src="js/level.js?v=5.8"></script>
    <script src="js/stonehenge.js?v=5.8"></script>
    <script src="js/stage3.js?v=5.8"></script>
    <script src="js/stage4.js?v=5.8"></script>
    <script src="js/player.js?v=5.8"></script>
    <script src="js/main.js?v=5.8"></script>
</body>
</html>
