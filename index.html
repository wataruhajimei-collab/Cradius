<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>クラディウス</title>
    <!-- ホーム画面追加用アイコン・Webアプリ設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="クラディウス">
    <meta name="application-name" content="クラディウス">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <!-- ゲーム画面（画面目一杯に拡大） -->
        <div id="game-container">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
        </div>
        <!-- ゲームスタート画面オーバーレイ -->
        <div id="start-screen">
            <div class="start-box">
                <h1 class="start-title">クラディウス</h1>
                <div class="start-sub">CRADIUS</div>
                <div class="start-btn-wrap">
                    <button id="btn-start" class="btn-game-start">GAME START</button>
                </div>
                <div class="start-guide">画面をタップ または [SPACE] で発進</div>
                <div class="start-controls-hint">
                    <div>移動: スワイプ / 矢印キー</div>
                    <div>ショット: [SHOT] / [Z]</div>
                    <div>パワーアップ: [POWER] / [X]</div>
                </div>
            </div>
        </div>

        <!-- 画面全体（余白を含む全域）をカバーするタッチ操作レイヤー -->
        <div id="touch-layer">
            <!-- 画面左側（余白〜画面中央）：どこでもスワイプ移動可能 -->
            <div id="touch-move-zone">
                <div id="move-hint">画面のどこでもスワイプ移動</div>
                <!-- 指の直下に現れるフローティングジョイスティック -->
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>

            <!-- 右側アクションボタン（余白または画面右端に配置） -->
            <div id="action-buttons">
                <button id="btn-powerup" class="action-btn btn-power" aria-label="パワーアップ">
                    <span class="btn-main">POWER</span>
                    <span class="btn-sub">[X]</span>
                </button>
                <button id="btn-shot" class="action-btn btn-shot" aria-label="ショット">
                    <span class="btn-main">SHOT</span>
                    <span class="btn-sub">[Z]</span>
                </button>
            </div>
        </div>
    </div>

    <script src="js/sound.js"></script>
    <script src="js/input.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/powerup.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/option.js"></script>
    <script src="js/level.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/player.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
