<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>PowerUp Weapon Switch Test</title>
</head>
<body>
    <h1>PowerUp Weapon Switch Test</h1>
    <div id="results">Running...</div>

    <script src="js/bullet.js"></script>
    <script src="js/laser.js"></script>
    <script src="js/missile.js"></script>
    <script src="js/option.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/input.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/player.js"></script>

    <script>
        const log = [];
        function assert(condition, msg) {
            if (!condition) {
                log.push('FAIL: ' + msg);
                console.error('FAIL: ' + msg);
                throw new Error(msg);
            } else {
                log.push('PASS: ' + msg);
            }
        }

        try {
            const p = new Player(100, 100);

            // 1. 初期状態テスト（NORMALショット）
            assert(p.weaponType === 'NORMAL', "Initial weapon is NORMAL");
            assert(p.canActivatePowerUp(0) === true, "Speed should be available initially");
            assert(p.canActivatePowerUp(1) === true, "Missile should be available initially");
            assert(p.canActivatePowerUp(2) === true, "Double should be available initially");
            assert(p.canActivatePowerUp(3) === true, "Laser should be available initially");
            assert(p.canActivatePowerUp(4) === true, "Option should be available initially");
            assert(p.canActivatePowerUp(5) === true, "Shield should be available initially");

            // 2. DOUBLE 選択テスト
            p.powerUpIndex = 2;
            p.activatePowerUp();
            assert(p.weaponType === 'DOUBLE', "Weapon is DOUBLE");
            assert(p.powerUpIndex === -1, "Gauge reset after activating DOUBLE");
            assert(p.canActivatePowerUp(2) === false, "Double cannot be selected while equipped");
            assert(p.canActivatePowerUp(3) === true, "Laser is available when Double is equipped");

            // DOUBLE 装備中にDOUBLEを再選択しようとしてもゲージ保護
            p.powerUpIndex = 2;
            p.activatePowerUp();
            assert(p.powerUpIndex === 2, "Gauge NOT consumed when selecting already equipped Double");

            // 3. LASER 選択テスト（DOUBLEからLASERへの切り替え）
            p.powerUpIndex = 3;
            p.activatePowerUp();
            assert(p.weaponType === 'LASER', "Weapon switched to LASER");
            assert(p.powerUpIndex === -1, "Gauge reset after activating LASER");
            assert(p.canActivatePowerUp(3) === false, "Laser cannot be selected while equipped");
            assert(p.canActivatePowerUp(2) === true, "Double is available when Laser is equipped");

            // LASER 装備中にLASERを再選択しようとしてもゲージ保護
            p.powerUpIndex = 3;
            p.activatePowerUp();
            assert(p.powerUpIndex === 3, "Gauge NOT consumed when selecting already equipped Laser");

            // 4. 再度 DOUBLE への切り替えテスト（LASERからDOUBLEへの切り替え）
            p.powerUpIndex = 2;
            p.activatePowerUp();
            assert(p.weaponType === 'DOUBLE', "Weapon switched back to DOUBLE");
            assert(p.powerUpIndex === -1, "Gauge reset after switching back to DOUBLE");
            assert(p.canActivatePowerUp(2) === false, "Double cannot be selected while equipped");
            assert(p.canActivatePowerUp(3) === true, "Laser is available again when Double is equipped");

            // 5. MISSILE 取得テスト（一度取得したら再選択不可）
            p.powerUpIndex = 1;
            p.activatePowerUp();
            assert(p.hasMissile === true, "Player has missile");
            assert(p.powerUpIndex === -1, "Gauge reset after missile activation");
            assert(p.canActivatePowerUp(1) === false, "Missile cannot be selected again");

            p.powerUpIndex = 1;
            p.activatePowerUp();
            assert(p.powerUpIndex === 1, "Gauge NOT consumed for unavailable Missile");

            // 6. SPEED（何回でも選択可能）
            const s0 = p.speed;
            p.powerUpIndex = 0;
            p.activatePowerUp();
            assert(p.speed === s0 + 1, "Speed increased");
            assert(p.canActivatePowerUp(0) === true, "Speed still available");

            // 7. OPTION（4個まで選択可能）
            for (let i = 0; i < p.maxOptions; i++) {
                assert(p.canActivatePowerUp(4) === true, "Option available under max");
                p.powerUpIndex = 4;
                p.activatePowerUp();
            }
            assert(p.options.length === 4, "Option count maxed");
            assert(p.canActivatePowerUp(4) === false, "Option unavailable at max");

            // 8. SHIELD（展開中は選択不可、破壊後は選択可能）
            assert(p.canActivatePowerUp(5) === true, "Shield available initially");
            p.powerUpIndex = 5;
            p.activatePowerUp();
            assert(p.shieldActive === true, "Shield active");
            assert(p.canActivatePowerUp(5) === false, "Shield unavailable while active");
            p.shieldActive = false;
            assert(p.canActivatePowerUp(5) === true, "Shield available after broken");

            // UI 描画テスト
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');
            ui.draw(ctx, canvas.width, p);
            log.push('PASS: UI.draw completed successfully');

            document.getElementById('results').innerHTML = '<pre>' + log.join('\n') + '\n\nALL TESTS PASSED SUCCESSFULLY!</pre>';
        } catch (e) {
            document.getElementById('results').innerHTML = '<pre style="color:red;">' + log.join('\n') + '\nERROR: ' + e.message + '</pre>';
        }
    </script>
</body>
</html>
