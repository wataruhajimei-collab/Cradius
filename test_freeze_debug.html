<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="log">START</div>
<script src="js/sound.js"></script>
<script src="js/input.js"></script>
<script src="js/collision.js"></script>
<script src="js/particle.js"></script>
<script src="js/bullet.js"></script>
<script src="js/enemy.js"></script>
<script src="js/powerup.js"></script>
<script src="js/ui.js"></script>
<script src="js/option.js"></script>
<script src="js/level.js"></script>
<script src="js/boss.js"></script>
<script src="js/player.js"></script>
<script src="js/main.js"></script>
<script>
window.onerror = function(msg, url, line, col, err) {
    document.getElementById('log').innerText = 'ERROR: ' + msg + ' at ' + line + ':' + col + '\nStack: ' + (err ? err.stack : '');
    console.error('CRITICAL ERROR:', msg, err);
};

try {
    // ゲームを初期化
    init();

    // プレイヤーをレーザー＋オプション3個状態にする
    player.hasLaser = true;
    player.options = [
        new Option(player, 1),
        new Option(player, 2),
        new Option(player, 3)
    ];

    // レベルを直ちにボス戦に設定
    levelManager.state = 'BOSS';
    levelManager.boss = new Boss(canvas.width, canvas.height / 2 - 50);

    // プレイヤーがレーザーを発射
    player.shoot();

    // 60フレーム回してみる
    for (let frame = 0; frame < 120; frame++) {
        update(16);
        draw();
    }

    document.getElementById('log').innerText = 'SUCCESS: 120 frames rendered without error! Boss HP=' + levelManager.boss.hp + ', shields=' + levelManager.boss.shields;
} catch (e) {
    document.getElementById('log').innerText = 'EXCEPTION: ' + e.message + '\nStack: ' + e.stack;
    console.error(e);
}
</script>
</body>
</html>
