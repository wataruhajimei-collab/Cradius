<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage 1 2x Boss & Stage 2 Stonehenge Full Test</title>
</head>
<body>
    <h1>Stage 1 2x Boss & Stage 2 Stonehenge Full Test</h1>
    <div id="results">Running tests...</div>

    <script src="js/sound.js"></script>
    <script src="js/input.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/powerup.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/option.js"></script>
    <script src="js/level.js"></script>
    <script src="js/stonehenge.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/player.js"></script>

    <script>
        const log = [];
        function assert(condition, msg) {
            if (!condition) {
                log.push('FAIL: ' + msg);
                console.error('FAIL: ' + msg);
                throw new Error(msg);
            } else {
                log.push('PASS: ' + msg);
            }
        }

        window.enemies = [];
        window.enemyBullets = [];
        window.playerBullets = [];
        window.particles = [];
        window.player = new Player(100, 300);

        try {
            // ==========================================
            // TEST 1: 2倍サイズボス (ビッグコア)
            // ==========================================
            log.push('--- TEST 1: 2x Big Core Boss ---');
            const boss = new Boss(800, 200);
            assert(boss.scale === 2, "Boss scale is exactly 2");
            assert(boss.width === 160, "Boss width is 160px (2x)");
            assert(boss.height === 200, "Boss height is 200px (2x)");
            assert(boss.hp === 35, "Boss HP is 35");
            assert(boss.shields === 5, "Boss has 5 shield plates");
            assert(boss.shieldHpPerPlate === 3, "Each shield plate has 3 HP");

            // コアサイズと位置
            const coreBounds = boss.getCoreBounds();
            assert(coreBounds.width === 64, "Core diameter is 64px (radius 32px, 2x)");
            assert(coreBounds.height === 64, "Core height is 64px (2x)");

            // 遮蔽板サイズ
            const shieldBounds = boss.getShieldBounds();
            assert(shieldBounds.height === 76, "Shield plate height is 76px (2x)");

            // 上下ハル判定
            const topHull = boss.getTopHullBounds();
            const bottomHull = boss.getBottomHullBounds();
            assert(topHull.height === 64, "Top hull height is 64px (2x)");
            assert(bottomHull.height === 64, "Bottom hull height is 64px (2x)");

            // 4連レーザー射撃テスト
            boss.bullets = [];
            boss.shoot();
            assert(boss.bullets.length === 4, "Boss fires 4 simultaneous laser beams");

            // ==========================================
            // TEST 2: 浮遊大陸と4門の新キャラ砲台
            // ==========================================
            log.push('--- TEST 2: Floating Island & 4 Laser Turrets ---');
            const island = new FloatingIsland(500, 200, 280, 70, 1.5);
            assert(island.turrets.length === 4, "Island has exactly 4 turrets");
            assert(island.turrets.filter(t => !t.isCeiling).length === 2, "2 turrets on top");
            assert(island.turrets.filter(t => t.isCeiling).length === 2, "2 turrets on bottom");
            
            // 砲台からの EnemyLaser 発射テスト
            const turret = island.turrets[0];
            turret.shoot();
            assert(enemyBullets.length > 0, "Enemy bullet fired");
            const firedLaser = enemyBullets[enemyBullets.length - 1];
            assert(firedLaser instanceof EnemyLaser, "Fired bullet is an instance of EnemyLaser");

            // ==========================================
            // TEST 3: ステージ2 ストーンヘンジ面と新キャラ
            // ==========================================
            log.push('--- TEST 3: Stage 2 Stonehenge & New Enemies ---');
            const stonehenge = new StonehengeStage(800, 600);
            stonehenge.start();
            assert(stonehenge.active === true, "Stonehenge stage active");

            // 壊れる石・壊れない石の生成確認
            assert(stonehenge.blocks.length > 0, "Stone blocks generated");
            const hasDestructible = stonehenge.blocks.some(b => b.isDestructible);
            const hasIndestructible = stonehenge.blocks.some(b => !b.isDestructible);
            assert(hasDestructible === true, "Contains destructible stone blocks");
            assert(hasIndestructible === true, "Contains indestructible stone blocks");

            // 新キャラ1: RuneTurret (古代ルーン砲台)
            const runeTurret = new RuneTurret(300, 200, false);
            assert(runeTurret.hp === 3, "RuneTurret HP is 3");
            runeTurret.shoot();
            assert(enemyBullets.some(b => b.color === '#c084fc'), "RuneTurret fires purple rune bullet");

            // 新キャラ2: StoneEyeEnemy (浮遊古代ストーンアイ)
            const stoneEye = new StoneEyeEnemy(400, 250);
            assert(stoneEye.hp === 2, "StoneEye HP is 2");
            stoneEye.shoot();
            assert(enemyBullets.some(b => b instanceof RingBullet), "StoneEye fires RingBullet (ion ring)");

            // 飛ぶ敵の定期スポーン
            const initialEnemyCount = enemies.length;
            stonehenge.flyingEnemyTimer = 3000;
            stonehenge.updateFlyingEnemies(100);
            assert(enemies.length > initialEnemyCount, "Flying enemies spawned dynamically");

            // ==========================================
            // TEST 4: レベルマネージャー
            // ==========================================
            log.push('--- TEST 4: LevelManager & Stage Jump ---');
            const lm = new LevelManager(800, 600);
            assert(lm.islandSpawnTimes[0] === 26000, "First island spawns at 26s (early spawn)");
            assert(lm.islandSpawnTimes[1] === 42000, "Second island spawns at 42s");
            assert(lm.islandSpawnTimes[2] === 58000, "Third island spawns at 58s");

            lm.startStage2();
            assert(lm.stage === 2, "Switched to Stage 2");

            document.getElementById('results').innerHTML = '<pre>' + log.join('\n') + '\n\nALL TESTS PASSED SUCCESSFULLY!</pre>';
        } catch (e) {
            document.getElementById('results').innerHTML = '<pre style="color:red;">' + log.join('\n') + '\nERROR: ' + e.message + '</pre>';
        }
    </script>
</body>
</html>
