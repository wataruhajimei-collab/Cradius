<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Stage 1 Overhaul & Stage 2 Test</title>
</head>
<body>
    <h1>Stage 1 Overhaul & Stage 2 Test</h1>
    <div id="results">Running tests...</div>

    <script src="js/sound.js"></script>
    <script src="js/input.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/particle.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/powerup.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/option.js"></script>
    <script src="js/level.js"></script>
    <script src="js/stonehenge.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/player.js"></script>

    <script>
        const log = [];
        function assert(condition, msg) {
            if (!condition) {
                log.push('FAIL: ' + msg);
                console.error('FAIL: ' + msg);
                throw new Error(msg);
            } else {
                log.push('PASS: ' + msg);
            }
        }

        // ダミーグローバル変数
        window.enemies = [];
        window.enemyBullets = [];
        window.playerBullets = [];
        window.particles = [];
        window.player = new Player(100, 300);

        try {
            // ==========================================
            // TEST 1: 浮遊大陸と4門のレーザー砲台
            // ==========================================
            log.push('--- TEST 1: Floating Island & 4 Laser Turrets ---');
            const island = new FloatingIsland(500, 200, 280, 70, 1.5);
            assert(island.width === 280, "Island width is 280");
            assert(island.height === 70, "Island height is 70");
            assert(island.turrets.length === 4, "Island has exactly 4 turrets");
            assert(island.turrets.filter(t => !t.isCeiling).length === 2, "2 turrets on top");
            assert(island.turrets.filter(t => t.isCeiling).length === 2, "2 turrets on bottom");
            
            // 座標追従テスト
            const initialTurretX = island.turrets[0].x;
            island.update();
            island.turrets[0].update();
            assert(island.x === 500 - 1.5, "Island scrolled by 1.5px");
            assert(island.turrets[0].x === initialTurretX - 1.5, "Turret followed island scroll");

            // レーザー砲台からの EnemyLaser 発射テスト
            const turret = island.turrets[0];
            turret.shoot();
            assert(enemyBullets.length > 0, "Enemy bullet fired");
            const firedLaser = enemyBullets[enemyBullets.length - 1];
            assert(firedLaser instanceof EnemyLaser, "Fired bullet is an instance of EnemyLaser");
            assert(firedLaser.length === 42, "Enemy laser length is 42px");
            assert(firedLaser.thickness === 5, "Enemy laser thickness is 5px");

            // 浮遊大陸の衝突判定テスト
            assert(island.checkCollision({ x: 550, y: 220, width: 20, height: 20 }) === true, "Collision inside island detected");
            assert(island.checkCollision({ x: 100, y: 100, width: 20, height: 20 }) === false, "Collision outside island is false");

            // ==========================================
            // TEST 2: 3倍巨大ボス (ビッグコア)
            // ==========================================
            log.push('--- TEST 2: 3x Giant Big Core Boss ---');
            const boss = new Boss(800, 150);
            assert(boss.scale === 3, "Boss scale is 3");
            assert(boss.width === 240, "Boss width is 240px (3x)");
            assert(boss.height === 300, "Boss height is 300px (3x)");
            assert(boss.hp === 45, "Boss HP is 45 (tougher for 3x giant)");
            assert(boss.shields === 5, "Boss has 5 shield plates");
            assert(boss.shieldHpPerPlate === 4, "Each shield plate has 4 HP");

            // コアの判定とサイズ
            const coreBounds = boss.getCoreBounds();
            assert(coreBounds.width === 96, "Core diameter is 96px (radius 48px, 3x)");
            assert(coreBounds.height === 96, "Core height is 96px (3x)");

            // 遮蔽板の判定とサイズ
            const shieldBounds = boss.getShieldBounds();
            assert(shieldBounds !== null, "Shield bounds exist");
            assert(shieldBounds.height === 114, "Shield plate height is 114px (3x)");
            assert(shieldBounds.width === 99, "Total shield width matches 5 plates with 21px spacing (3x)");

            // ハル（無敵装甲）の判定
            const topHull = boss.getTopHullBounds();
            const bottomHull = boss.getBottomHullBounds();
            assert(topHull.height === 96, "Top hull height is 96px (3x)");
            assert(bottomHull.height === 96, "Bottom hull height is 96px (3x)");

            // 4連レーザー射撃テスト
            boss.bullets = [];
            boss.shoot();
            assert(boss.bullets.length === 4, "Boss fires 4 simultaneous laser beams");
            assert(boss.bullets[0].speedX === -7.0, "Boss laser speed is -7.0");

            // ==========================================
            // TEST 3: ステージ2 ストーンヘンジ面 (破壊可能/不能石)
            // ==========================================
            log.push('--- TEST 3: Stage 2 Stonehenge & Stone Digging ---');
            const stonehenge = new StonehengeStage(800, 600);
            stonehenge.start();
            assert(stonehenge.active === true, "Stonehenge stage is active");

            // 破壊できる石のテスト
            const destructibleBlock = new StoneBlock(200, 200, 40, 40, true);
            assert(destructibleBlock.isDestructible === true, "Block is destructible");
            assert(destructibleBlock.hp === 3, "Initial HP is 3");
            
            // 1発目ヒット
            destructibleBlock.hit(1);
            assert(destructibleBlock.hp === 2, "HP reduced to 2");
            assert(destructibleBlock.active === true, "Block still active");

            // レーザー（2ダメージ）ヒットで破壊
            destructibleBlock.hit(2);
            assert(destructibleBlock.hp <= 0, "HP reduced to 0");
            assert(destructibleBlock.active === false, "Block destroyed (active = false)");

            // 破壊できない石（モノリス）のテスト
            const indestructibleBlock = new StoneBlock(300, 300, 40, 40, false);
            assert(indestructibleBlock.isDestructible === false, "Block is indestructible");
            const hitResult = indestructibleBlock.hit(5);
            assert(hitResult === false, "Indestructible block cannot be destroyed");
            assert(indestructibleBlock.active === true, "Indestructible block remains active");

            // レーザー貫通掘削テスト
            stonehenge.blocks = [
                new StoneBlock(400, 200, 40, 40, true),
                new StoneBlock(440, 200, 40, 40, true),
                new StoneBlock(480, 200, 40, 40, true)
            ];
            const testLaser = new Laser(player, -100, 380, 20); // y = 200
            testLaser.width = 200;
            stonehenge.handleBulletCollisions([testLaser]);
            assert(stonehenge.blocks[0].hp === 1, "First block hit by laser (3 -> 1)");

            // ==========================================
            // TEST 4: レベルマネージャーとステージ遷移
            // ==========================================
            log.push('--- TEST 4: LevelManager & Stage Progression ---');
            const lm = new LevelManager(800, 600);
            assert(lm.stage === 1, "Initial stage is 1");
            
            // ステージ2開始テスト
            lm.startStage2();
            assert(lm.stage === 2, "Stage progressed to 2");
            assert(window.stonehengeStage !== null, "stonehengeStage initialized");
            assert(window.stonehengeStage.active === true, "stonehengeStage is active");

            // レンダリングテスト
            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 600;
            const ctx = canvas.getContext('2d');
            lm.draw(ctx);
            log.push('PASS: LevelManager.draw for Stage 2 rendered without error');

            document.getElementById('results').innerHTML = '<pre>' + log.join('\n') + '\n\nALL TESTS PASSED SUCCESSFULLY!</pre>';
        } catch (e) {
            document.getElementById('results').innerHTML = '<pre style="color:red;">' + log.join('\n') + '\nERROR: ' + e.message + '</pre>';
        }
    </script>
</body>
</html>
